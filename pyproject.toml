[project]
name = "rose"
version = "0.3.0"
description = "ROSE: a local MCP server that gives Claude tools to control this Linux machine"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",  # passkey (WebAuthn) signature checks for fingerprint approvals
    "customtkinter>=6.0.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "python-xlib>=0.33",
    "websockets>=17.4",
    "vosk>=0.3.45",  # offline "Hey Rose" wake word (rose face)
]

[project.scripts]
rose = "rose.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rose"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
