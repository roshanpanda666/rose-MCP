  <g id="sweat"><path d="M300 196 Q290 212 296 219 Q304 224 309 215 Q312 206 300 196 Z" fill="#8fd0ff" stroke="#5aa7e6" stroke-width="1.5"/><ellipse cx="300" cy="212" rx="2" ry="3" fill="#fff" opacity=".8"/></g>
