<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- Rose: anime-style avatar rig. Every animated part is its own group (id) so the desktop dial
       (PIL sprites, rose/companion.py) and the phone app (inline SVG) can move them. -->
  <defs>
    <linearGradient id="gHairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2350"/><stop offset="1" stop-color="#2e0b1f"/>
    </linearGradient>
    <linearGradient id="gHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c3166"/><stop offset=".55" stop-color="#5e1a3d"/><stop offset="1" stop-color="#3d0f28"/>
    </linearGradient>
    <linearGradient id="gLock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c1f47"/><stop offset="1" stop-color="#34091f"/>
    </linearGradient>
    <radialGradient id="gSkin" cx=".42" cy=".38" r=".75">
      <stop offset="0" stop-color="#fff4ee"/><stop offset=".6" stop-color="#ffdccb"/><stop offset="1" stop-color="#efb29d"/>
    </radialGradient>
    <linearGradient id="gNeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a893"/><stop offset=".5" stop-color="#ffd7c6"/>
    </linearGradient>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2246"/><stop offset="1" stop-color="#120a18"/>
    </linearGradient>
    <linearGradient id="gWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7c9dc"/><stop offset=".38" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="gIris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0821"/><stop offset=".45" stop-color="#a8174f"/><stop offset="1" stop-color="#ff8cb6"/>
    </linearGradient>
    <radialGradient id="gRose" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ff6f9a"/><stop offset=".6" stop-color="#d81b55"/><stop offset="1" stop-color="#7d0a30"/>
    </radialGradient>
  </defs>

  <g id="hair-back">
    <path d="M104 232 C92 138 140 76 210 74 C282 76 330 138 318 232 C316 300 334 362 350 420 L70 420 C86 362 106 300 104 232 Z" fill="url(#gHairBack)"/>
