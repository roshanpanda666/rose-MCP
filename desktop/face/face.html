<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self'; script-src 'self'">
<title>Rose</title>
<link rel="stylesheet" href="face.css">
</head>
<body>
<!-- The desktop widget: a card like the phone's home-screen widget. Click it: talk. Avatar: the chat.
     Drag: move. Right-click: menu. The border colour shows her state; a light runs round it while she
     listens or thinks. -->
<div id="card" class="card idle" title="Click: talk · Rose's face: chat · Drag: move · Right-click: menu">
  <div class="ring"></div>
  <div class="card-in">
    <div id="rose" class="rose" title="Open the chat">
      <div id="halo" class="halo"></div>
      <div id="svgbox" class="svgbox"></div>
      <div id="fx" class="fx"></div>
      <div id="badge" class="badge" hidden></div>
    </div>
    <div class="txt">
      <div class="head"><b>Rose</b><span id="dot" class="dot">●</span><span id="status" class="status">Click to talk</span></div>
      <div id="line" class="line">Face: open the chat. Here: talk.</div>
    </div>
<div id="bubble" class="bubble" hidden><span class="b-text"></span></div>
<div id="ctl" class="ctl">
  <button id="muteBtn" class="ctl-b" type="button" aria-pressed="false" title="Mute Rose"></button>
  <button id="micBtn" class="ctl-b" type="button" aria-pressed="true" title="Mic on"></button>
  <button id="closeBtn" class="ctl-b" type="button" title="Close Rose (she keeps listening; right-click to quit)"></button>
</div>
  </div>
</div>
<script src="look.js"></script>
<script src="face.js"></script>
</body>
</html>
